name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages 배포에 필요한 최소 권한
permissions:
  contents: read
  pages: write
  id-token: write

# 진행 중인 배포는 취소하지 않고 큐에 쌓는다 (프로덕션 배포 유실 방지)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        # 프로젝트 페이지는 /<repo>/ 아래에서 서빙되므로 base path를 넘긴다.
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Add SPA fallback
        # Pages에는 서버 리라이트가 없다. /museum 같은 경로를 새로고침해도
        # index.html이 뜨도록 404.html을 같은 내용으로 복사한다.
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
