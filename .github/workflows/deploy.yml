name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # 커스텀 도메인을 붙였다면 여기에 적는다 (예: app.honpamang.kr).
  # 비워두면 https://<user>.github.io/<repo>/ 로 배포된다.
  # 이 값을 채우기 전에 DNS와 Settings → Pages → Custom domain을 먼저 맞춰야 한다.
  CUSTOM_DOMAIN: ''

# Pages 배포에 필요한 최소 권한
permissions:
  contents: read
  pages: write
  id-token: write

# 진행 중인 배포는 취소하지 않고 큐에 쌓는다 (프로덕션 배포 유실 방지)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Resolve base path
        # 커스텀 도메인은 루트에서 서빙되지만, 프로젝트 페이지는 /<repo>/ 아래다.
        # 여기를 틀리면 자산 경로가 어긋나 흰 화면이 뜬다.
        run: |
          if [ -n "$CUSTOM_DOMAIN" ]; then
            echo "BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "BASE_PATH=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"
          fi

      - name: Build
        run: npm run build

      - name: Add SPA fallback and CNAME
        # Pages에는 서버 리라이트가 없다. /museum 같은 경로를 새로고침해도
        # index.html이 뜨도록 404.html을 같은 내용으로 복사한다.
        # CNAME은 Settings의 커스텀 도메인이 초기화돼도 배포로 다시 세워지게 하는 안전장치다.
        run: |
          cp dist/index.html dist/404.html
          if [ -n "$CUSTOM_DOMAIN" ]; then
            echo "$CUSTOM_DOMAIN" > dist/CNAME
          fi

      - uses: actions/configure-pages@v5
        with:
          # 저장소에 Pages가 아직 켜져 있지 않으면 첫 실행에서 켠다.
          # (저장소가 공개이거나 Pro 이상이어야 한다 — 무료 + 비공개면 여기서 실패한다.)
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
